name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    # GitHub 的 macOS 15 runner 是 Apple Silicon。
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # 最新的 Xcode 不一定能部署到我们支持的最低系统（macOS 11），按 SDK 的声明挑选。
      - name: 选择 Xcode
        run: scripts/select-xcode.sh
      - name: 工具链
        run: swift --version && uname -m
      - name: 构建
        run: swift build
      - name: 测试
        run: swift test
      - name: 组装 .app（ad-hoc 签名，最低系统版本必须与 Package.swift 一致）
        run: STRICT_MIN_OS=1 scripts/build-app.sh release
      - name: 检查产物
        run: scripts/verify-app.sh build/Fidget.app
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Fidget-unsigned
          path: build/Fidget.app
