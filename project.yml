# XcodeGen 配置：生成 Fidget.xcodeproj，用于在 Xcode 中运行、调试、Archive 与自动签名。
# 代码全部来自本地 Swift Package（Package.swift），应用目标只包含入口文件与资源。
name: Fidget
options:
  bundleIdPrefix: com.lacdon
  # 产品支持 macOS 11；Xcode 27 最低只能部署到 macOS 12，会提示并按 12 构建（发布由 CI 构建，见 docs/ARCHITECTURE.md §9）。
  deploymentTarget:
    macOS: "11.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  xcodeVersion: "27.0"
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "1"
    ARCHS: arm64
    VALID_ARCHS: arm64
    EXCLUDED_ARCHS: x86_64
    ONLY_ACTIVE_ARCH: "YES"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_HARDENED_RUNTIME: "YES"
    ENABLE_APP_SANDBOX: "NO"
    DEAD_CODE_STRIPPING: "YES"
packages:
  FidgetPackage:
    path: .
targets:
  Fidget:
    type: application
    platform: macOS
    sources:
      - path: Sources/Fidget
      - path: Resources/Assets.xcassets
    dependencies:
      - package: FidgetPackage
        product: FidgetApp
    entitlements:
      path: Resources/Fidget.entitlements
    settings:
      base:
        PRODUCT_NAME: Fidget
        PRODUCT_BUNDLE_IDENTIFIER: com.lacdon.fidget
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "NO"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    scheme:
      testTargets: []
